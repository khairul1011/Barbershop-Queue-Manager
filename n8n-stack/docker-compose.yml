# Stack n8n + WAHA (WhatsApp HTTP API, non-resmi, engine GOWS), pengganti bot
# server/. Progres & rencana cutover: PROGRES.md.
#
# Seluruh port sengaja di-bind ke 127.0.0.1 saja. Akses publik disediakan lewat
# Cloudflare Tunnel (koneksi keluar), sama seperti pola yang sudah dipakai bot
# produksi -- proyek ini pernah mengalami insiden API yang terekspos tanpa
# otentikasi, jadi tidak ada port masuk yang dibuka langsung ke internet.

services:
  n8n:
    # Image resmi + package `qrcode` untuk membuat PNG QR pembayaran di Code
    # node (image resmi tidak memuatnya; jangan diganti layanan QR pihak
    # ketiga). Dipasang di /usr/local/lib/node_modules supaya bisa di-require
    # task runner n8n. Versi n8n dipatok di n8n/Dockerfile agar build ulang di
    # server tidak meng-upgrade n8n diam-diam.
    build: ./n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # WEBHOOK_URL wajib berisi URL publik. Tanpa ini, URL webhook yang
      # ditampilkan n8n akan menunjuk ke localhost dan tidak bisa dipanggil
      # layanan luar (mis. Xendit).
      WEBHOOK_URL: ${N8N_PUBLIC_URL}
      N8N_HOST: ${N8N_HOSTNAME}
      N8N_PORT: 5678
      # Default https untuk server di balik Cloudflare Tunnel; saat dijalankan
      # di lokal, .env cukup meng-override keduanya menjadi http dan 0.
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      # Kunci enkripsi kredensial. JANGAN diubah setelah ada kredensial
      # tersimpan -- mengubahnya membuat seluruh kredensial lama tidak terbaca.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Database memakai SQLite bawaan n8n (file di volume n8n_data), tanpa
      # container Postgres -- supaya stack muat di VPS kecil (RAM < 1 GB).
      NODE_FUNCTION_ALLOW_EXTERNAL: qrcode
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n

  waha:
    # Image GOWS dibuat terpisah per arsitektur CPU (bukan multi-arch):
    # `gows` untuk amd64/x86, `gows-arm` untuk arm64 (Apple Silicon, server ARM).
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:-gows}
    restart: unless-stopped
    ports:
      # Sengaja TIDAK diekspos lewat Cloudflare Tunnel: n8n memanggil WAHA lewat
      # jaringan internal (http://waha:3000). Dashboard diakses lewat localhost
      # (di server: SSH port forward). Port 3001 karena 3000 dipakai Vite.
      - "127.0.0.1:3001:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      # Dipakai WAHA untuk membentuk media.url di event webhook, supaya n8n
      # bisa mengunduh media lewat jaringan internal.
      WAHA_BASE_URL: http://waha:3000
      # Satu-satunya pelindung API WAHA (header X-Api-Key). Siapa pun yang
      # memilikinya bisa mengirim pesan atas nama nomor WhatsApp yang tersambung.
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

volumes:
  n8n_data:
  waha_sessions:
  waha_media:

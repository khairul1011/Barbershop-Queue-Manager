<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarberFlow — Takhta Barbershop</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0a'/%3E%3Cg fill='none' stroke='%23fafafa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='6.5' cy='6.5' r='2.2'/%3E%3Ccircle cx='6.5' cy='17.5' r='2.2'/%3E%3Cline x1='19' y1='4' x2='8' y2='15.5'/%3E%3Cline x1='19' y1='20' x2='8' y2='8.5'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      /* Cegah kedip putih sebelum src/index.css ke-load, dan kasih loading
         state instan (HTML/CSS murni, nggak nunggu React) selama JS bundle
         masih di-download/di-parse. Bentuknya sengaja disamain persis sama
         spinner authLoading di App.tsx (kotak rounded bg-primary pulse)
         biar transisinya nyambung mulus, bukan kelihatan dua loading beda. */
      html, body { background-color: #0a0a0a; margin: 0; }
      #initial-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      }
      #initial-loader div {
        width: 40px; height: 40px; border-radius: 14px; background-color: #fafafa;
        animation: initial-loader-pulse 1.5s ease-in-out infinite;
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-loader"><div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

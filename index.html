<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <style>
      /* Cegah kedip putih sebelum src/index.css ke-load, dan kasih loading
         state instan (HTML/CSS murni, nggak nunggu React) selama JS bundle
         masih di-download/di-parse. Bentuknya sengaja disamain persis sama
         spinner authLoading di App.tsx (kotak rounded bg-primary pulse)
         biar transisinya nyambung mulus, bukan kelihatan dua loading beda. */
      html, body { background-color: #0a0a0a; margin: 0; }
      #initial-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      }
      #initial-loader div {
        width: 40px; height: 40px; border-radius: 14px; background-color: #fafafa;
        animation: initial-loader-pulse 1.5s ease-in-out infinite;
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-loader"><div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
